name: Backend CD

on:
  push:
    branches:
      - master
    paths:
      - "starter/backend/**"

  workflow_dispatch:

jobs:
  test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: |
          pipenv install --dev

      - name: Run tests
        working-directory: starter/backend
        run: |
          pipenv run pytest

  build-and-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          docker build \
            -t project:backend-${{ github.sha }} \
            .

      - name: Tag Docker image
        run: |
          docker tag \
            project:backend-${{ github.sha }} \
            720915213019.dkr.ecr.us-east-1.amazonaws.com/project:backend-${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            720915213019.dkr.ecr.us-east-1.amazonaws.com/project:backend-${{ github.sha }}

      - name: Tag latest image
        run: |
          docker tag \
            project:backend-${{ github.sha }} \
            720915213019.dkr.ecr.us-east-1.amazonaws.com/project:backend-latest

      - name: Push latest image
        run: |
          docker push \
            720915213019.dkr.ecr.us-east-1.amazonaws.com/project:backend-latest
